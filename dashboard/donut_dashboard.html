    window.onload = function () {
      console.log('Donut Dashboard v3 loaded');
      // Firebase configuration
      const firebaseConfig = {
        apiKey: "AIzaSyCTRiBIILwjjB4GfBHQ7xU74KQZgpgvQZ0",
        authDomain: "thermomonitor-467ea.firebaseapp.com",
        databaseURL: "https://thermomonitor-467ea-default-rtdb.firebaseio.com",
        projectId: "thermomonitor-467ea",
        storageBucket: "thermomonitor-467ea.firebasestorage.app",
        messagingSenderId: "986825023684",
        appId: "1:986825023684:web:5b1915f5e65c92ce48e991",
        measurementId: "G-8PJKB3TV0F"
      };
      firebase.initializeApp(firebaseConfig);
      const db = firebase.database();
      console.log('Firebase initialized. DB ref for readings:', db.ref('readings'));

      // Threshold inputs
      const greenMaxInput = document.getElementById('greenMaxInput');
      const yellowMaxInput = document.getElementById('yellowMaxInput');
      const redMaxInput = document.getElementById('redMaxInput');
      const unitToggle   = document.getElementById('unitToggle');
      const lastReadings = {};
      function toDisplayValue(tempC) {
        return unitToggle.checked ? (tempC * 9/5 + 32) : tempC;
      }

      const centerX = 100;
      const centerY = 100;
      const radius = 80;
      const startAngle = 135;
      const endAngle = 405;
      const maxTemp = 250;

      function updateGauge(r) {
        // Add debug log for update
        console.log("Update received:", r);
        // Only update gauges for provided board/channel
        if (typeof r.board_id === 'undefined' || typeof r.channel === 'undefined') return;
        lastReadings[`${r.board_id}-${r.channel}`] = r;
        const tempC   = typeof r.raw_temp === 'number' ? r.raw_temp : 0;
        const tempVal = toDisplayValue(tempC);

        const clampedTempC = Math.min(Math.max(tempC, 0), maxTemp);
        const greenMax = parseInt(greenMaxInput.value);
        const yellowMax = parseInt(yellowMaxInput.value);

        let color;
        if (tempC <= greenMax) {
          color = "#4caf50";
        } else if (tempC <= yellowMax) {
          color = "#ff9800";
        } else {
          color = "#f44336";
        }

        // Gauge stroke styling
        const arcId = `gaugeArc-${r.board_id + 1}-${r.channel}`;
        const textId = `gaugeText-${r.board_id + 1}-${r.channel}`;
        console.log(`Looking for arc: ${arcId}, text: ${textId}`);
        const arc = document.getElementById(arcId);
        const text = document.getElementById(textId);
        if (!arc || !text) return;

        const fullLength = 2 * Math.PI * radius * (270 / 360); // 270° arc
        const visibleLength = (clampedTempC / maxTemp) * fullLength;

        arc.setAttribute("stroke-dasharray", `${visibleLength} ${fullLength}`);
        arc.setAttribute("stroke-dashoffset", "0");
        arc.setAttribute("stroke", color);

        const unit = unitToggle.checked ? '°F' : '°C';
        text.textContent = tempVal.toFixed(1) + " " + unit;
        text.setAttribute("fill", color);
      }

      greenMaxInput.addEventListener('change', () => {
        // Trigger update with last known temp if any
      });
      yellowMaxInput.addEventListener('change', () => {
        // Trigger update with last known temp if any
      });
      redMaxInput.addEventListener('change', () => {
        // redMax is not used in color logic currently
      });

      // Subscribe to the latest readings (by timestamp) and update on value changes
      const latestRef = db.ref('readings').orderByChild('timestamp').limitToLast(32);
      latestRef.on('value', snapshot => {
        const readings = Object.values(snapshot.val() || {});
        readings.forEach(updateGauge);
      });

      unitToggle.addEventListener('change', () => {
        Object.values(lastReadings).forEach(updateGauge);
      });

    };
  </script>
